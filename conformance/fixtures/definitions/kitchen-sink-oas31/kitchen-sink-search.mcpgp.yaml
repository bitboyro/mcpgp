# The kitchen sink in exposure mode discovery (search style) (tools-contract §15), for the gate's S2.
apiVersion: mcpgp/v1
kind: McpServer
metadata:
  name: kitchen-sink-search
  title: Kitchen sink (search)
apis:
  - id: kitchen
    toolPrefix: kitchen
    contracts:
      - { version: "1.0", spec: contracts/kitchen-sink-1.0.yaml, default: true }
    select:
      access: all
instances:
  mode: single
exposure:
  mode: discovery
  discoveryStyle: search
