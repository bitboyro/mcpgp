name: publish

# The platform image on Docker Hub (docs/guides/self-hosting.md):
#   push to main          → <user>/mcpgp-platform:main, :sha-<commit>
#   tag vX.Y.Z            → :X.Y.Z, :X.Y, :latest (and :X from 1.0.0), plus a GitHub release
#   Run workflow (manual) → the branch it runs on, as :<branch>, or the tag you type in
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, read & write).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (empty: the branch name)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in the build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          code=$(sed -n 's/.*String VERSION = "\(.*\)";/\1/p' core/src/main/java/ro/bitboy/mcpgp/core/Compiler.java)
          echo "tag $tag, pom.xml $pom, Compiler.VERSION $code"
          [ "$tag" = "$pom" ] && [ "$tag" = "$code" ]

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mcpgp-platform
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=mcpgp platform
            org.opencontainers.image.description=Generates MCP servers from OpenAPI: web UI, REST API, builds

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pushed
        run: echo "${{ steps.meta.outputs.tags }}" | sed 's/^/pushed /'

  release:
    # the GitHub release for a version tag: its CHANGELOG section and how to pull the image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          v="${VERSION#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          { printf '## Docker image\n\n```bash\ndocker pull docker.io/%s/mcpgp-platform:%s\n```\n\nSetting it up: docs/guides/self-hosting.md\n\n' "$IMAGE_USER" "$v"; cat notes.md; } > release.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release.md --verify-tag
