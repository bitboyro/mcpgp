name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tools for the package check (sha256sum is there already)
        run: sudo apt-get update -q && sudo apt-get install -y -q strace minisign
      - name: Build and test (schemas validate every example and conformance file; the package check)
        env:
          # SelfContainedCheckTest: checksums, minisign -V, and the packaged server's connections under strace
          MCPGP_PACKAGE_CHECK: "1"
        run: mvn -B verify

  postgres:
    # the platform's tests again, on the PostgreSQL store (TestStores)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mcpgp
          POSTGRES_USER: mcpgp
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mcpgp" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the modules the platform uses
        run: mvn -B -q install -DskipTests
      - name: Platform tests on PostgreSQL
        env:
          MCPGP_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/mcpgp
          MCPGP_TEST_POSTGRES_PASSWORD: ci-only
        run: mvn -B -pl platform verify

  deploy:
    # the image and docker compose as docs/guides/self-hosting.md describes them, checked end to end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_FILE: compose.yaml:compose.postgres.yaml:compose.signing.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Secrets and settings for this run only
        run: |
          openssl rand -base64 24 > secrets/admin_password
          openssl rand -base64 24 > secrets/db_password
          (cd .. && mvn -B -q install -DskipTests && mvn -B -q -pl cli dependency:build-classpath -Dmdep.outputFile=/tmp/cli.cp)
          java -cp "$(ls ../cli/target/mcpgp-cli-*.jar):$(cat /tmp/cli.cp)" \
            ro.bitboy.mcpgp.cli.Main keygen --out /tmp/key
          cp /tmp/key/mcpgp.key secrets/signing_key
          chmod 644 secrets/*_password secrets/signing_key
          cp .env.example .env
      - name: Start the platform with PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: python3 smoke-test.py http://127.0.0.1:8443 admin secrets/admin_password
      - name: Data survives a restart
        run: |
          docker compose restart platform
          docker compose up -d --wait --wait-timeout 120
          python3 - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:8443/api/v1"
          password = open("secrets/admin_password").read().strip()
          request = urllib.request.Request(base + "/sessions", data=json.dumps({"name": "admin", "password": password}).encode(),
                                           headers={"Content-Type": "application/json"}, method="POST")
          token = json.load(urllib.request.urlopen(request))["value"]
          servers = json.load(urllib.request.urlopen(urllib.request.Request(base + "/servers", headers={"Authorization": "Bearer " + token})))
          assert "smoke-orders-mcp" in json.dumps(servers), servers
          print("✓ smoke-orders-mcp is still there after a restart")
          PY
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links between docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
