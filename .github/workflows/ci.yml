name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tools for the package check (sha256sum is there already)
        run: sudo apt-get update -q && sudo apt-get install -y -q strace minisign
      - name: Build and test (schemas validate every example and conformance file; the package check)
        env:
          # SelfContainedCheckTest: checksums, minisign -V, and the packaged server's connections under strace
          MCPGP_PACKAGE_CHECK: "1"
        run: mvn -B verify

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links between docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
