openapi: 3.1.0
info:
  title: mcpgp platform API
  version: "1.0"
  description: >
    Definitions, versions, builds and identities of a self-hosted mcpgp platform (spec/platform-api.md).
    Every endpoint needs a bearer token, except this document.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: servers, description: Server definition projects and their versions }
  - { name: builds, description: Builds, their logs and artifacts }
  - { name: library, description: Shared items referenced as mcpgp://<workspace>/<kind>/<name>@<version> }
  - { name: identities, description: Identities, tokens and the activity log }
  - { name: approvals, description: Requests waiting for a person }
  - { name: admin, description: Export and import }
paths:
  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List servers
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false }, description: List archived servers instead }
      responses:
        "200": { description: Servers, content: { application/json: { schema: { $ref: "#/components/schemas/ServerList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createServer
      tags: [servers]
      summary: Create server
      description: Creates a server from a first version of its project (a zip, or JSON files).
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" } }
        - { name: title, in: query, schema: { type: string } }
        - { name: message, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectFiles" } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server
      responses:
        "200": { description: Server, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    post:
      operationId: addVersion
      tags: [servers]
      summary: Add version
      description: Adds a version; the same content as the latest version adds nothing.
      parameters:
        - { name: message, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectFiles" } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Version added, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        "200": { description: Same content as the latest version, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}:
    parameters: [ { $ref: "#/components/parameters/ServerId" }, { $ref: "#/components/parameters/Version" } ]
    get:
      operationId: getVersion
      tags: [servers]
      summary: Get version
      responses:
        "200": { description: The version and its files, content: { application/json: { schema: { $ref: "#/components/schemas/VersionDetail" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}/validate:
    parameters: [ { $ref: "#/components/parameters/ServerId" }, { $ref: "#/components/parameters/Version" } ]
    post:
      operationId: validateVersion
      tags: [servers]
      summary: Validate version
      description: Runs the compiler and returns its diagnostics.
      responses:
        "200": { description: Diagnostics, content: { application/json: { schema: { $ref: "#/components/schemas/Validation" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}/manifest:
    parameters: [ { $ref: "#/components/parameters/ServerId" }, { $ref: "#/components/parameters/Version" } ]
    get:
      operationId: getManifest
      tags: [servers]
      summary: Get manifest
      description: The manifest of a version (what agents will get, with provenance).
      responses:
        "200": { description: Manifest, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}/operations:
    parameters: [ { $ref: "#/components/parameters/ServerId" }, { $ref: "#/components/parameters/Version" } ]
    get:
      operationId: listOperations
      tags: [servers]
      summary: List operations
      description: Every operation of the version's contracts and what became of it (tool, resource, excluded by select and why, hidden by a rule).
      responses:
        "200": { description: Operations per API, content: { application/json: { schema: { $ref: "#/components/schemas/OperationList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}/naming:
    parameters: [ { $ref: "#/components/parameters/ServerId" }, { $ref: "#/components/parameters/Version" } ]
    get:
      operationId: getNaming
      tags: [servers]
      summary: Get naming
      description: The naming policy the version extends, its own naming settings, the effective policy and the lock file's entries.
      responses:
        "200":
          description: Naming
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  extends: { type: [string, "null"] }
                  own: { type: object }
                  effective: { type: object }
                  lock:
                    type: object
                    properties:
                      present: { type: boolean }
                      entries: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, since: { type: string } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/versions/{version}/example-config:
    get:
      operationId: getExampleConfig
      tags: [servers]
      summary: Example configuration
      description: The example configuration the version's package ships, with secrets as references only.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/Version"
      responses:
        "200": { description: The example configuration, content: { application/yaml: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/edits:
    post:
      operationId: editServer
      tags: [servers]
      summary: Edit definition
      description: >-
        Changes the root definition of the latest version (base) and saves the result as the next
        version, if it compiles. Paths are JSON Pointers, plus [key=value] to pick a list item, e.g.
        /apis/[id=orders]/select/access. Comments and formatting elsewhere in the file are kept.
        With dryRun, returns the edited definition and its manifest (or diagnostics) and saves nothing.
      parameters:
        - $ref: "#/components/parameters/ServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, changes]
              properties:
                base: { type: integer, description: The latest version number the changes were made on }
                message: { type: string }
                dryRun: { type: boolean, default: false }
                operations: { type: boolean, default: false, description: With dryRun, also list the operations of the edited definition }
                changes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [path]
                    properties:
                      op: { enum: [set, remove], default: set }
                      path: { type: string }
                      value: { description: Any JSON value; null is a value (in a variant it removes what is inherited) }
      responses:
        "200": { description: The dry run's result, content: { application/json: { schema: { type: object } } } }
        "201": { description: The new version, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/duplicate:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    post:
      operationId: duplicateServer
      tags: [servers]
      summary: Duplicate server
      description: An independent copy of the latest version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string }, title: { type: string } }, required: [id] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/variants:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    post:
      operationId: createVariant
      tags: [servers]
      summary: Create variant
      description: A server that extends this one (latest, or pinned to its current version) and holds only overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string }, title: { type: string }, pin: { type: boolean, default: false } }, required: [id] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: List library items
      responses:
        "200": { description: Items with their references, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /library/{kind}:
    parameters: [ { $ref: "#/components/parameters/Kind" } ]
    post:
      operationId: createLibraryItem
      tags: [library]
      summary: Create library item
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: title, in: query, schema: { type: string } }
        - { name: root, in: query, description: The file references point to, when there are several, schema: { type: string } }
        - { name: message, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectFiles" } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /library/{kind}/{name}:
    parameters: [ { $ref: "#/components/parameters/Kind" }, { name: name, in: path, required: true, schema: { type: string } } ]
    get:
      operationId: getLibraryItem
      tags: [library]
      summary: Get library item
      responses:
        "200": { description: The item, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /library/{kind}/{name}/versions:
    parameters: [ { $ref: "#/components/parameters/Kind" }, { name: name, in: path, required: true, schema: { type: string } } ]
    post:
      operationId: addLibraryVersion
      tags: [library]
      summary: Add library version
      parameters:
        - { name: root, in: query, schema: { type: string } }
        - { name: message, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ProjectFiles" } }
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: Version added, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/archive:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    post:
      operationId: archiveServer
      tags: [servers]
      summary: Archive server
      parameters: [ { $ref: "#/components/parameters/IfMatch" } ]
      responses:
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/restore:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    post:
      operationId: restoreServer
      tags: [servers]
      summary: Restore server
      parameters: [ { $ref: "#/components/parameters/IfMatch" } ]
      responses:
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /platform-mcp:
    get:
      operationId: getMcpPackage
      tags: [builds]
      summary: Download platform MCP server
      description: >-
        The platform's own MCP server as a package: agents run it themselves, configured with the
        platform's address and their own token, and get this API as tools.
      responses:
        "200": { description: The package, content: { application/zip: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Problem" }
  /servers/{id}/builds:
    parameters: [ { $ref: "#/components/parameters/ServerId" } ]
    get:
      operationId: listBuilds
      tags: [builds]
      summary: List builds
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Newest first, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Build" } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startBuild
      tags: [builds]
      summary: Start build
      description: Queues a build of a version (default latest); poll getBuild until it is done.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: A version number or latest, default: latest }
                buildNumber: { type: integer, minimum: 1 }
                versionOverride: { type: string }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    get:
      operationId: getBuild
      tags: [builds]
      summary: Get build
      responses:
        "200": { description: Build, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBuild
      tags: [builds]
      summary: Delete build files
      description: Removes the files; the record stays. Released builds must be archived first.
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/log:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    get:
      operationId: getBuildLog
      tags: [builds]
      summary: Get build log
      responses:
        "200": { description: The log so far, content: { text/plain: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/artifacts:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    get:
      operationId: listArtifacts
      tags: [builds]
      summary: List artifacts
      responses:
        "200": { description: Artifacts and the files inside the package, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/artifacts/{name}:
    parameters:
      - { $ref: "#/components/parameters/BuildId" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadArtifact
      tags: [builds]
      summary: Download artifact
      parameters:
        - { name: file, in: query, description: One file of the package, e.g. docs/INSTALL.md, schema: { type: string } }
      responses:
        "200": { description: The file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/release:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    post:
      operationId: releaseBuild
      tags: [builds]
      summary: Release build
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/archive:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    post:
      operationId: archiveBuild
      tags: [builds]
      summary: Archive build
      responses:
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /builds/{build}/restore:
    parameters: [ { $ref: "#/components/parameters/BuildId" } ]
    post:
      operationId: restoreBuild
      tags: [builds]
      summary: Restore build
      responses:
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/Build" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /sessions:
    post:
      operationId: signIn
      tags: [identities]
      summary: Sign in
      description: Signs in a person with a local account; the answer is a session token (12 hours). No bearer token needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, password: { type: string, format: password } }, required: [name, password] }
      responses:
        "201": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /sessions/current:
    delete:
      operationId: signOut
      tags: [identities]
      summary: Sign out
      description: Revokes the session token in use (and clears the web UI's session cookie). API tokens are revoked with revokeToken instead.
      responses:
        "200": { description: Signed out, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /platform:
    get:
      operationId: getSignInOptions
      tags: [identities]
      summary: Sign-in options
      description: Which ways of signing in this installation offers. No bearer token needed.
      security: []
      responses:
        "200": { description: Sign-in options, content: { application/json: { schema: { type: object, properties: { auth: { type: object, properties: { local: { type: boolean }, oidc: { type: boolean } } } } } } } }
  /settings:
    get:
      operationId: getSettings
      tags: [identities]
      summary: Platform settings
      description: The workspace name, sign-in options, whether a signing key is configured, build retention and agent guardrails.
      responses:
        "200": { description: Settings, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /identities/{identityId}/password:
    put:
      operationId: setPassword
      tags: [identities]
      summary: Set password
      parameters:
        - { name: identityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string, format: password }, currentPassword: { type: string, format: password } }, required: [password] }
      responses:
        "200": { description: Set, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approvals
      parameters:
        - { name: status, in: query, schema: { enum: [pending, approved, rejected, all], default: pending } }
      responses:
        "200": { description: Approvals, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Approval" } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/approve:
    post:
      operationId: approveRequest
      tags: [approvals]
      summary: Approve request
      parameters: [ { name: approvalId, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { comment: { type: string } } } } } }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/reject:
    post:
      operationId: rejectRequest
      tags: [approvals]
      summary: Reject request
      parameters: [ { name: approvalId, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { comment: { type: string } } } } } }
      responses:
        "200": { description: Rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /export:
    get:
      operationId: exportStore
      tags: [admin]
      summary: Export store
      description: Everything as a zip, to move to another platform release (before 1.0.0 stores are not migrated).
      parameters:
        - { name: artifacts, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: The export, content: { application/zip: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Problem" }
  /import:
    post:
      operationId: importStore
      tags: [admin]
      summary: Import store
      description: Fills a fresh store from an export.
      requestBody:
        required: true
        content: { application/zip: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: Counts of what was imported, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Problem" }
  /me:
    get:
      operationId: getMe
      tags: [identities]
      summary: Who am I
      responses:
        "200": { description: The calling identity, content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /identities:
    get:
      operationId: listIdentities
      tags: [identities]
      summary: List identities
      responses:
        "200": { description: Identities, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Identity" } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIdentity
      tags: [identities]
      summary: Create identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { enum: [person, agent, pipeline] }
                name: { type: string }
                password: { type: string, format: password, description: People only; at least 12 characters }
                role: { enum: [viewer, builder, releaser, admin] }
                scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
              required: [kind, name]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /tokens:
    get:
      operationId: listTokens
      tags: [identities]
      summary: List tokens
      responses:
        "200": { description: Tokens (never their values), content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Token" } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createToken
      tags: [identities]
      summary: Create token
      description: The value is in the answer once and never again.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity: { type: string }
                scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
                label: { type: string }
                expiresInDays: { type: integer, minimum: 1, maximum: 730, default: 90 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /tokens/{tokenId}:
    delete:
      operationId: revokeToken
      tags: [identities]
      summary: Revoke token
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Token" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /activity:
    get:
      operationId: listActivity
      tags: [identities]
      summary: List activity
      parameters:
        - { name: target, in: query, schema: { type: string } }
        - { name: server, in: query, schema: { type: string }, description: "A server id: its own entries and those of its builds." }
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: Action or its prefix, e.g. version. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: Newest first, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Activity" } } } } } } }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ServerId: { name: id, in: path, required: true, schema: { type: string } }
    Version: { name: version, in: path, required: true, description: A version number or latest, schema: { type: string } }
    BuildId: { name: build, in: path, required: true, schema: { type: string } }
    Kind: { name: kind, in: path, required: true, schema: { enum: [contracts, naming, rules, packs, templates] } }
    IfMatch: { name: If-Match, in: header, description: The server's ETag, for optimistic concurrency, schema: { type: string } }
  responses:
    Problem:
      description: An error (RFC 9457)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Scope: { enum: [servers:read, servers:write, builds:run, builds:release, builds:delete, library:write, approvals:decide, admin] }
    ProjectFiles:
      type: object
      properties:
        files: { type: object, additionalProperties: { type: string }, description: "path → file content" }
      required: [files]
    VersionRef:
      type: object
      properties:
        number: { type: integer }
        digest: { type: string }
        message: { type: string }
        author: { type: string }
        created: { type: string, format: date-time }
    Server:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        parent: { type: string }
        archived: { type: boolean }
        latestVersion: { type: integer }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        versions: { type: array, items: { $ref: "#/components/schemas/VersionRef" } }
    OperationList:
      type: object
      properties:
        version: { type: integer }
        apis:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              select: { type: object, description: The API's select block as the definition has it }
              operations:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    method: { type: string }
                    path: { type: string }
                    operationId: { type: string }
                    summary: { type: string }
                    deprecated: { type: boolean }
                    tags: { type: array, items: { type: string } }
                    contracts: { type: array, items: { type: string } }
                    state: { enum: [tool, resource, excluded, hidden] }
                    tool: { type: string }
                    exclusion:
                      type: object
                      properties:
                        kind: { enum: [access, include, exclude, deprecated] }
                        reason: { type: string }
                        index: { type: integer }
                        selector: { type: object }
    ServerList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Server" } }
    VersionDetail:
      type: object
      properties:
        number: { type: integer }
        digest: { type: string }
        root: { type: string }
        files: { type: array, items: { type: object, properties: { path: { type: string }, sha256: { type: string } } } }
    Validation:
      type: object
      properties:
        ok: { type: boolean }
        diagnostics: { type: array, items: { type: object, properties: { level: { type: string }, code: { type: string }, message: { type: string }, location: { type: string } } } }
    Build:
      type: object
      properties:
        id: { type: string }
        server: { type: string }
        version: { type: integer }
        status: { enum: [queued, running, succeeded, failed] }
        startedBy: { type: string }
        created: { type: string, format: date-time }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        serverVersion: { type: string }
        released: { type: boolean }
        releasedBy: { type: string }
        archived: { type: boolean }
        deleted: { type: boolean }
        artifacts: { type: array, items: { type: object, properties: { name: { type: string }, size: { type: integer }, sha256: { type: string } } } }
        error: { type: string }
    Approval:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        target: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        status: { enum: [pending, approved, rejected] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        comment: { type: string }
    Identity:
      type: object
      properties:
        id: { type: string }
        kind: { enum: [person, agent, pipeline] }
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        created: { type: string, format: date-time }
        disabled: { type: boolean }
    Token:
      type: object
      properties:
        id: { type: string }
        identity: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        label: { type: string }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time }
        revoked: { type: boolean }
        value: { type: string, description: Only in the answer that creates the token }
    Activity:
      type: object
      properties:
        ts: { type: string, format: date-time }
        actor: { type: string }
        actorKind: { type: string }
        action: { type: string }
        target: { type: string }
        outcome: { type: string }
        details: { type: object }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
