name: mcp-servers

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write          # release assets

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/example/mcpgp-cli:0.4.0    # the CLI image; pin by digest in real use: @sha256:…
    env:
      MCPGP_SIGNING_KEY: "${{ secrets.MCPGP_SIGNING_KEY }}"   # the definitions ask for signed packages
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                   # tags and history, for diff against the last release

      - name: Validate
        run: mcpgp validate --all

      - name: What changed since the last release
        if: github.event_name == 'pull_request'
        # on the run's summary page; post it as a PR comment with your comment action of choice
        run: mcpgp diff --all --against last-release --format md >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: mcpgp build --all --frozen-lock     # version follows the API (contract) version

      - name: Test against mocks
        run: mcpgp test --all

      - name: Sign
        if: github.ref_type == 'tag'
        run: mcpgp sign dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
