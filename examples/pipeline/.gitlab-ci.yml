image: docker.io/example/mcpgp-cli:0.4.0   # the CLI image; pin by digest in real use

stages: [check, build, release]

variables:
  MCPGP_SIGNING_KEY: $MCPGP_SIGNING_KEY   # a masked CI/CD variable; the definitions ask for signed packages

check:
  stage: check
  script:
    - mcpgp validate --all
    - mcpgp diff --all --against last-release --format md

build:
  stage: build
  script:
    - mcpgp build --all --frozen-lock     # version follows the API (contract) version
    - mcpgp test --all
  artifacts: { paths: [dist/] }

release:
  stage: release
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - mcpgp sign dist/
  artifacts: { paths: [dist/] }
