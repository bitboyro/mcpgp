image: registry.example.com/mcpgp:0.4.2   # pin by digest in real use

stages: [check, build, release]

variables:
  GIT_DEPTH: "0"

check:
  stage: check
  script:
    - mcpgp validate --all
    - mcpgp diff --all --against last-release --format md | tee diff.md
  artifacts: { paths: [diff.md] }

build:
  stage: build
  script:
    - mcpgp build --all --frozen-lock     # version follows the API (contract) version
    - mcpgp test --all
  artifacts: { paths: [dist/] }

release:
  stage: release
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - mcpgp sign dist/
  artifacts: { paths: [dist/] }
