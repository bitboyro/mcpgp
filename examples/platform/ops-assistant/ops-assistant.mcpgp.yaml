# One MCP server combining three APIs. Tools are prefixed per API.
apiVersion: mcpgp/v1
kind: McpServer
metadata:
  name: ops-assistant
  title: Integration operations assistant

apis:
  - id: orders
    contracts:
      - { version: "2.0", spec: mcpgp://acme/contracts/orders@2.0, default: true }
    select:
      access: read-write
      include: [{ tag: [orders, customers, invoices] }]
    upstreamAuth: { supported: [basic, oauth2ClientCredentials] }

  - id: tickets
    title: Example Tickets API
    contracts:
      - { version: "3", spec: contracts/tickets-3.yaml, default: true }
    select:
      include: [{ tag: [tickets, ticket-comments, ticket-search] }]
    upstreamAuth: { supported: [basic, bearer] }

  - id: monitoring
    title: Example Monitoring API
    contracts:
      - { version: "2024-09-01", spec: contracts/monitoring.yaml, default: true }
    select: { access: read-only }
    upstreamAuth: { supported: [oauth2ClientCredentials] }

instances:
  mode: multi

naming:
  extends: mcpgp://acme/naming/acme-standard@2   # CLI: --workspace ../workspace
  namespace: { perApi: true }               # orders_*, tickets_*, monitoring_*

exposure:
  mode: discovery                            # many tools across three APIs

packs:
  audit: {}
  health: {}

build:
  targets: [docker, jar]
  docs: [people, agents]
